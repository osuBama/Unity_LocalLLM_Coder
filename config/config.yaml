# Local AI orchestrator configuration.
# Relative paths are resolved against paths.root. The AI_ROOT environment
# variable overrides paths.root; AI_CONFIG points at an alternative config file.

paths:
  root: "D:\\AI"                # your install folder (or set AI_ROOT)
  memory: "memory"
  conversations: "conversations"
  database: "database\\memory.db"
  logs: "logs"
  backups: "backups"
  prompts: "prompts"

ollama:
  # Instance A: the primary GPU (docs/DOCUMENTATION.md §2, §4)
  primary:
    base_url: "http://127.0.0.1:11434"
    model: "qwen3:14b"          # default for POST /chat; proxied requests keep their own model
    timeout_seconds: 600
    num_ctx: 16384              # size to your VRAM (docs/DOCUMENTATION.md §2.2); qwen3:14b at 16k fits 12 GB with q8_0 KV
    keep_alive: "30m"

  # Instance B: the memory GPU
  memory:
    base_url: "http://127.0.0.1:11435"
    model: "qwen3:8b"
    timeout_seconds: 600
    num_ctx: 8192
    keep_alive: "30m"
    think: false                # for models with a thinking mode; remove the line for others

memory:
  project_id: "default"
  max_context_tokens: 2500      # memory budget injected into the primary prompt (~15% of primary num_ctx)
  max_memory_file_tokens: 4000  # `ai memory validate` warns when a file grows past this
  max_entry_tokens: 600         # single entries longer than this are truncated in context
  enable_semantic_retrieval: true    # hybrid keyword + vector search (see embeddings:)
  asynchronous_updates: true
  create_backups: true
  history_versions_per_file: 50
  max_entry_chars: 1500
  min_confidence: 0.6
  trigger_mode: "heuristic"     # heuristic | always
  extractor_memory_tokens: 1500
  extractor_interaction_tokens: 3000
  worker_enabled: true
  worker_poll_seconds: 2
  max_attempts: 5
  retry_base_seconds: 30
  think_extraction: true        # memory model may think on extraction (background, nobody waits)
  think_consolidation: true     # ...and on idle-time consolidation

conversation:
  retain_raw_history: true
  format: "jsonl"
  recent_turns: 2               # POST /chat only: last N exchanges sent verbatim alongside memory
  capture_corrections: true     # "no, it's X" turns become golden-question candidates (ai eval candidates)

proxy:
  # Ollama-compatible endpoint for OpenClaw (native API, /api/chat).
  enabled: true
  inject_memory: true
  append_system_prompt: true    # appends prompts/primary_system.txt to the client's system prompt
  queue_memory_updates: true
  # trim_mode "size" (default): nothing is trimmed or compressed while the prompt fits
  # ollama.primary.num_ctx (minus memory budget and reply_reserve_tokens). When it would not
  # fit: old tool output is compressed first, then the oldest turns are cut back to
  # trim_target_ratio of the window, so the next change is many turns away.
  # trim_mode "turns": the older turn-count schedule below.
  trim_mode: size
  trim_target_ratio: 0.5       # lower = deeper, rarer cuts (cheaper, leans more on summaries)
  reply_reserve_tokens: 1024
  calibrate_tokens: true        # size estimates learn chars/token from Ollama's real counts
  # Turn-count trimming (trim_mode: turns). In size mode trim_keep_user_turns is the minimum
  # number of recent turns always kept verbatim. When it grows past 10 user turns it is cut
  # back to ~4; the cut point then stays put for 5-6 turns so the prompt cache keeps hitting.
  # The session summary + memory stand in for what was cut. 0 = never trim.
  trim_trigger_user_turns: 10
  trim_keep_user_turns: 4
  trim_requires_summary: true   # never cut turns the session summary doesn't cover yet

flags:
  # The primary model ends replies with <memory_flag> tags for durable changes.
  # The proxy strips them before the client sees them; they force and guide extraction.
  enabled: true
  max_per_turn: 3
  max_chars: 300

compression:
  # Old tool results (file dumps, logs, command output) are replaced by short digests written
  # by the memory model. Results from the last 2 user turns always stay verbatim, and the
  # boundary moves only when the trim point moves, so the prompt cache keeps hitting.
  enabled: true
  keep_recent_user_turns: 2     # must be < proxy.trim_keep_user_turns
  min_result_tokens: 400        # don't bother digesting small outputs
  digest_max_tokens: 200
  step_turns: 6                 # boundary schedule before trimming starts / with trimming off
  never_compress_tools: []      # e.g. ["read_file"] to always keep a tool's output verbatim

stable_memory:
  # Constraints, objectives and environment rarely change, so they go into the system prompt
  # as a frozen "memory base" that Ollama's prompt cache can reuse. It is refreshed only on turns
  # where the prompt prefix changes anyway (trim/compression steps). Changes in between are sent
  # as small "UPDATED SINCE" lines with the user's message, so nothing is ever stale.
  enabled: true
  categories: [constraint, objective, environment]
  max_tokens: 1000              # part of memory.max_context_tokens, not extra
  refresh_turns: 6              # only used when trimming and compression are both off

consolidation:
  # Idle-time memory hygiene on the memory GPU. Merges near-duplicate entries and tightens
  # overgrown ones; never adds entries and never deletes on its own. Every run takes a backup.
  enabled: true
  idle_minutes: 10              # no requests for this long = idle
  min_interval_hours: 12        # at most one automatic run per interval...
  min_changes_since_last: 5     # ...and only if memory changed at least this much since
  similarity_threshold: 0.5     # deterministic pre-filter: only similar entries are shown together
  rewrite_min_tokens: 120       # entries longer than this may be tightened
  rewrite_max_ratio: 0.8        # a rewrite must shrink the entry to at most 80%
  identifier_coverage: 0.9      # merges/rewrites must keep 90% of names, numbers, paths, versions
  max_changes_per_run: 10
  max_cluster_size: 6
  stale_after_days: 30          # `ai memory review` lists active entries never used for this long

embeddings:
  # Embedding model for semantic memory search and history recall. Runs on the memory instance
  # (which is allowed 2 loaded models so it never evicts the memory model). If it is slow or down,
  # retrieval silently falls back to keyword search.
  enabled: true
  model: "nomic-embed-text"
  # base_url: "http://127.0.0.1:11435"   # default: the memory instance
  timeout_seconds: 3
  min_similarity: 0.35          # vector-only memory matches below this are ignored

history_recall:
  # Short verbatim excerpts from OLDER exchanges (other sessions, or turns already trimmed away)
  # when the prompt clearly relates to them. Labelled with date; marked as possibly outdated.
  enabled: true
  max_tokens: 600
  top_k: 2
  min_similarity: 0.6
  cue_min_similarity: 0.45      # lower bar when you say "last time", "earlier", "remember"...
  chunk_chars: 1500

references:
  # Documentation and code libraries (Unity docs, packages, your libraries). Add them with
  # `ai docs add <folder> --name ...` or in the console's Library tab. The model reaches them
  # on demand through MCP tools (docs_search, docs_lookup at /mcp), and, for libraries marked
  # auto-inject, through a small automatic excerpt budget per turn.
  enabled: true
  chunk_tokens: 350
  half_precision: true          # float16 vectors: half the RAM
  min_similarity: 0.35          # for searches the model asks for
  auto_max_tokens: 800          # automatic excerpts per turn; 0 = only on demand
  auto_top_k: 3
  auto_min_similarity: 0.55     # stricter than on-demand search
  mcp_enabled: true
  tool_max_tokens: 1500         # cap on one docs_search / docs_lookup result

tools:
  # Tool access control. Every tool your client offers (OpenClaw built-ins, each MCP server) is
  # registered automatically and grouped by source; set each source or tool to off / automatic /
  # on_demand in the console's Tools tab or with `ai tools`. off = the model never sees it and calls
  # are blocked; automatic = full definition every request; on_demand = one line in a load_tools
  # catalog, loaded for the rest of the conversation when the model asks.
  enabled: true
  default_mode: automatic       # for newly seen tools; on_demand saves the most context
  meta_tool_name: load_tools
  block_disabled_calls: true
  max_load_rounds: 2

thinking:
  # Primary-model thinking per turn. auto: thinking is switched OFF only for clearly simple
  # turns (short, no code/errors, no why/debug/design/implement-type words, EN+PT); otherwise
  # the client's choice stands. Saying "think" or "step by step" always keeps it on.
  # client: never touch it. on/off: force it.
  mode: auto
  simple_max_words: 25

session:
  # Rolling per-conversation summary kept by the memory model, injected once history is trimmed.
  summaries_enabled: true
  summary_max_tokens: 400

application:
  host: "127.0.0.1"
  port: 8000
  log_level: "INFO"
